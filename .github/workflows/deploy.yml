# main 브랜치에 푸시하면 Expo 웹을 정적 빌드해서 GitHub Pages로 배포한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 깃허브 Actions 탭에서 수동 실행도 가능

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 최신 것만 진행
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 로컬 개발 환경(Node 24 / npm 11)과 맞춘다.
      # Node 20(npm 10)에서는 npm 11로 만든 package-lock.json을 읽지 못해 npm ci가 실패한다.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 웹 정적 빌드
        run: npm run build:web
        env:
          EXPO_PUBLIC_VISIT_LOG_URL: ${{ secrets.EXPO_PUBLIC_VISIT_LOG_URL }}

      # 레시피 상세 주소(/recipe/xxxx)로 바로 들어오거나 새로고침해도 앱이 뜨도록
      # 모든 미매칭 경로를 앱 진입점으로 보낸다.
      - name: 404 폴백 추가
        run: cp dist/index.html dist/404.html

      # GitHub Pages는 기본적으로 `_`로 시작하는 폴더를 무시한다.
      # Expo 빌드 결과물에 `_expo/` 폴더가 있으므로 .nojekyll이 반드시 필요하다.
      - name: .nojekyll 추가
        run: touch dist/.nojekyll

      # enablement: Pages가 꺼져 있으면 워크플로가 알아서 켠다(설정에서 수동으로 켤 필요 없음)
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
